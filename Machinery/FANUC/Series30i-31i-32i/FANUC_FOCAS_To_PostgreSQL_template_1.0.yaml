    type: int
    order: 5
  - id: 16
    name: Program Name
    propertyLinks:
    - id: 86
      targetDataMapperPropertyId: 16
      sourceBridgePropertyId: 38
    type: string
    order: 6
  - id: 17
    name: Cycle Time
    propertyLinks:
    - id: 87
      targetDataMapperPropertyId: 17
      sourceBridgePropertyId: 39
    type: int
    order: 7
  - id: 18
    name: Alarms
    propertyLinks:
    - id: 88
      targetDataMapperPropertyId: 18
      sourceBridgePropertyId: 40
    type: json
    order: 8
  - id: 19
    name: Status
    propertyLinks:
    - id: 89
      targetDataMapperPropertyId: 19
      sourceBridgePropertyId: 31
    type: string
    order: 9
  # --- Transformations: produce the JSON shapes the SQL output properties expect ---
  - id: 20
    name: Insert Machine
    propertyLinks: []
    transformationCodeBody: |-
      const Mode = msg.payload[10]

      return {
          value: {
              'Serial': '${Machine Name}',
              'Name': '${Machine Name}',
              'Protocol': 'FANUC',
              'Model': '${Machine Model}',
              'Manufacturer': '${Machine Manufacturer}'
          }
      }
    type: json
    order: 10
  - id: 21
    name: Insert Observation
    propertyLinks: []
    transformationCodeBody: |-
      const Mode = msg.payload[10]
      const Execution = msg.payload[11]

      // Map FANUC mode (cnc_statinfo.aut) to the machine_mode enum
      let mode = 'Other';
      switch (Mode) {
          case 'MANUAL':
              mode = 'Manual';
              break;
          case 'MANUAL_DATA_INPUT':
              mode = 'MDI';
              break;
          case 'AUTOMATIC':
              mode = 'Automatic';
              break;
          case 'EDIT':
              mode = 'Other';
              break;
      }

      // We only receive data while polling succeeds, so the control is reachable.
      // Map to the machine_state enum based on availability.
      let state = (Execution === 'UNAVAILABLE') ? 'NotConnected' : 'Available';

      return {
          value: {
              'Serial': '${Machine Name}',
              'Mode': mode,
              'State': state
          }
      }
    type: json
    order: 11
  - id: 22
    name: Insert Overrides
    propertyLinks: []
    transformationCodeBody: |-
      const Feed = parseInt(msg.payload[13])
      const Speed = parseInt(msg.payload[14])
      const Rapid = parseInt(msg.payload[15])

      return {
          value: {
              'Serial': '${Machine Name}',
              'Feed': isNaN(Feed) ? 0 : Feed,
              'Speed': isNaN(Speed) ? 0 : Speed,
              'Rapid': isNaN(Rapid) ? 0 : Rapid
          }
      }
    type: json
    order: 12
  - id: 23
    name: Program Data Log
    propertyLinks: []
    transformationCodeBody: |-
      const ProgramName = msg.payload[16]
      const Execution = msg.payload[11]
      const CycleTime = parseInt(msg.payload[17])

      // Map FANUC execution state to the program_state enum
      let programState = 'Idle';
      switch (Execution) {
          case 'ACTIVE':
              programState = 'Running';
              break;
          case 'READY':
              programState = 'Idle';
              break;
          case 'PROGRAM_STOPPED':
          case 'OPTIONAL_STOP':
          case 'STOPPED':
          case 'FEED_HOLD':
              programState = 'Stopped';
              break;
          case 'PROGRAM_COMPLETED':
              programState = 'Completed';
              break;
          case 'INTERRUPTED':
              programState = 'Interrupted';
              break;
          case 'UNAVAILABLE':
              programState = 'Not Selected';
              break;
      }

      // Keep only the file name (strip any path/drive)
      let name = (ProgramName || '').toString().split(/[/\\]+/).pop();
      if (!name) name = 'Unknown';

      return {
          value: {
              Serial: '${Machine Name}',
              ProgramName: name,
              ProgramState: programState,
              CycleTime: isNaN(CycleTime) ? 0 : CycleTime
          }
      }
    type: json
    order: 13
  - id: 24
    name: Insert Alarms
    propertyLinks: []
    transformationCodeBody: |-
      const Alarms = msg.payload[18]

      // The FANUC connector publishes a JSON array of:
      //   { AxisCode, Axis, Number, Message, TypeCode, Type, Id }
      let parsed = [];
      try {
          parsed = typeof Alarms === 'string' ? JSON.parse(Alarms) : (Alarms || []);
      } catch (e) {
          parsed = [];
      }

      // Map FANUC alarm type abbreviations to a numeric severity bucket
      const severityForType = (type) => {
          switch (type) {
              case 'SV': // servo
              case 'SP': // spindle
              case 'OH': // overheat
                  return 800;
              case 'OT':  // overtravel
              case 'APC':
                  return 700;
              case 'PS':  // P/S
              case 'PC':  // PMC
              case 'IO':  // I/O
                  return 500;
              case 'EX':  // external message
                  return 300;
              default:
                  return 500;
          }
      };

      const alarms = parsed.map(a => ({
          Code: a.Id || ('' + a.Number),
          Message: a.Message || '',
          Source: a.Type || (a.Axis ? ('Axis ' + a.Axis) : 'CNC'),
          Severity: severityForType(a.Type),
          Time: new Date().toISOString()
      }));

      return {
          value: {
              Serial: '${Machine Name}',
              Alarms: alarms
          }
      }
    type: json
    order: 14
