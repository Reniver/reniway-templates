      targetBridgePropertyId: 65
      sourceDataMapperPropertyId: 20
    retain: false
    queryString: >-
      INSERT INTO machines VALUES (@Serial, @Name, @Protocol, @Model, @Manufacturer)

      ON CONFLICT (serial) DO UPDATE

      SET
          name = EXCLUDED.name,
          protocol = EXCLUDED.protocol,
          model = EXCLUDED.model,
          manufacturer = EXCLUDED.manufacturer;
    parameters: '{"Serial":"Text","Name":"Text","Protocol":"Text","Model":"Text","Manufacturer":"Text"}'
    direction: Output
    type: json
    order: 10
    isSystemProperty: false
    isPermanent: false
