dataMappers:
- id: 2
  name: ${Machine Name} - Mapper
  properties:
  # --- Inputs: linked directly to FANUC field-connector properties ---
  - id: 10
    name: Mode
    propertyLinks:
    - id: 80
      targetDataMapperPropertyId: 10
      sourceBridgePropertyId: 32
    type: string
    order: 0
  - id: 11
    name: Execution
    propertyLinks:
    - id: 81
      targetDataMapperPropertyId: 11
      sourceBridgePropertyId: 33
    type: string
    order: 1
  - id: 13
    name: Feed Override
    propertyLinks:
    - id: 83
      targetDataMapperPropertyId: 13
      sourceBridgePropertyId: 35
    type: int
    order: 3
  - id: 14
    name: Spindle Override
    propertyLinks:
