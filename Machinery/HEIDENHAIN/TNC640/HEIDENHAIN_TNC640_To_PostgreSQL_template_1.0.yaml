  - id: 25
    name: Errors
    propertyLinks:
    - id: 89
      targetDataMapperPropertyId: 25
      sourceBridgePropertyId: 63
    type: json[]
    order: 10
  - id: 26
    name: Insert Alarms
    propertyLinks: []
    transformationCodeHeader: |-
      const SIK = msg.payload[16]
      const Errors = msg.payload[25]

      const SIK_timestamp = new Date(msg.timestamps[16]);
      const Errors_timestamp = new Date(msg.timestamps[25]);
    transformationCodeBody: |-
      const convertSeverity = (severity) => {
          switch (severity) {
              case 0: return 1;
              case 1: return 400;
              case 2: return 500;
              case 3: return 600;
              case 4: return 700;
              case 5: return 800;
              case 6: return 900;
              case 7: return 200;
              case 8: return 400;
              case 9: return 100;
              default: return 500;
          }
      };

      const convertTimestamp = (timeStamp) => {
          if (!timeStamp || typeof timeStamp.Seconds !== 'number') {
              return new Date();
          }
          const nanos = typeof timeStamp.Nanos === 'number' ? timeStamp.Nanos : 0;
          const nanosAsMillis = Math.floor(nanos / 1000000);
          const totalMillis = (timeStamp.Seconds * 1000) + nanosAsMillis;
          return new Date(totalMillis);
      };

      let errors = JSON.parse(Errors).map(x => {
          return {
              'Code': x.NumberAsText,
              'Message': x.Text,
              'Source': x.Internals,
              'Severity': convertSeverity(x.Class),
              'Time': convertTimestamp(x.TimeStamp),
          }
      })
      let result = {
          "Serial": '${Machine Name}',
          "Alarms": errors
      };

      let result_timestamp_optional = new Date(Math.max(SIK_timestamp, Errors_timestamp));
    transformationCodeFooter: |-
      return {
         value: result,
         timestamp: result_timestamp_optional
      };
    type: json
    kind: Transformation
