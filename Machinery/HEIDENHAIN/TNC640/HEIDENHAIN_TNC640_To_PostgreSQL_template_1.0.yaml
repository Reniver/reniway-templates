  - id: 26
    name: Insert Alarms
    propertyLinks: []
    transformationCodeBody: >-
      const SIK = msg.payload[16]

      const Errors = msg.payload[25]


      convertSeverity = (severity) => {
          switch (severity) {
              case 0: return 1;
              case 1: return 400;
              case 2: return 500;
              case 3: return 600;
              case 4: return 700;
              case 5: return 800;
              case 6: return 900;
              case 7: return 200;
              case 8: return 400;
              case 9: return 100;
          }
      }; 


      convertTimestamp = (timeStamp) => {
          const nanosAsMillis = Math.floor(timeStamp.Nanos / 1000000);
          const totalMillis = (timeStamp.Seconds * 1000) + nanosAsMillis;
          return new Date(totalMillis);
      }


      let errors = JSON.parse(Errors).map(x => {
          return {
              'Code': x.NumberAsText,
              'Message': x.Text,
              'Source': x.Internals,
              'Severity': convertSeverity(x.Class),
              'Time': convertTimestamp(x.TimeStamp),
          }
      })


      return {
          value: {
              "Serial": '${Machine Name}',
              "Alarms": errors
          }
      }
    type: json
