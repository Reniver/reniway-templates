    propertyLinks:
    - id: 0
      sourceBridgePropertyId: 31
    type: string
    order: 12
  - id: 68
    name: Machine Running Time
    propertyLinks:
    - id: 111
      targetDataMapperPropertyId: 68
      sourceBridgePropertyId: 34
    type: int
    order: 11
  - id: 69
    name: Program Data Log
    propertyLinks: []
    transformationCodeHeader: |-
      const Program_Status = msg.payload[35]
      const SIK = msg.payload[16]
      const Program_Position = msg.payload[36]
      const Status = msg.payload[67]

      const Program_Status_timestamp = new Date(msg.timestamps[35]);
      const SIK_timestamp = new Date(msg.timestamps[16]);
      const Program_Position_timestamp = new Date(msg.timestamps[36]);
      const Status_timestamp = new Date(msg.timestamps[67]);
    transformationCodeBody: |-
      console.log(Program_Status);

      // Helper: convert program status to human-readable form
      function parseProgramStatus(status) {
          if( Status === 'Started') {
              if (!status) return "Unknown";
              return status
                  .replace(/^DNC_PRG_STS_/, "")   // remove prefix if present
                  .toLowerCase()
                  .replace(/_/g, ' ')
                  .replace(/\b\w/g, c => c.toUpperCase());
              
          } else {
              return "Unknown";
          }
      }

      // Robust helper: extract program name from many possible input shapes
      function extractProgramName(pos) {
          try {
              // Normalize input
              let candidate = pos;

              // If it's a string, try to parse JSON; otherwise keep the string
              if (typeof candidate === 'string') {
                  try {
                      candidate = JSON.parse(candidate);
                  } catch (e) {
                      // keep as string
                  }
              }

              // Determine programPath
              let programPath;
              if (Array.isArray(candidate)) {
                  // New logic: Map over the array to get all ProgramName properties and join them with a '/'
                  programPath = candidate.map(item => {
                      let format_name = item.ProgramName.split(/[/\\]+/).pop();
                      return item && format_name;
                      }).join(' | ');
              } else if (candidate && typeof candidate === 'object' && candidate.ProgramName) {
                  programPath = candidate.ProgramName;
              } else if (typeof candidate === 'string') {
                  // Remove wrapping quotes if present (e.g. "\"[...]"")
                  let maybe = candidate.trim();
                  if (maybe.length >= 2 && maybe[0] === '"' && maybe[maybe.length - 1] === '"') {
                      maybe = maybe.slice(1, -1);
                  }
                  // Try parse that snippet as JSON (in case it's a JSON stringified array)
                  try {
                      const parsed = JSON.parse(maybe);
                      if (Array.isArray(parsed) && parsed[0] && parsed[0].ProgramName) {
                          // New logic for parsed array: Map and join
                          programPath = parsed.map(item => item && item.ProgramName).join('/');
                      } else {
                          programPath = maybe;
                      }
                  } catch (e) {
                      programPath = maybe;
                  }
              }

              if (!programPath) return "Unknown";

              // Unescape double backslashes (\\\\ -> \\ -> \)
              programPath = programPath.replace(/\\\\/g, "\\");
              // Split on both forward and back slashes and take the last segment
              const file = programPath.split(/[/\\]+/).pop();
              if (!file) return "Unknown";
              // Strip extension if present
              return file;
          } catch (e) {
              return "Unknown";
          }
      }

      const readableStatus = parseProgramStatus(Program_Status);
      const programName = extractProgramName(Program_Position);

      // Return the exact shape you asked for
      let result = {
          Serial: '${Machine Name}',
          ProgramName: programName,
          ProgramState: readableStatus,
          CycleTime: 0
      };

      let result_timestamp_optional = new Date(Math.max(Program_Status_timestamp, SIK_timestamp, Program_Position_timestamp, Status_timestamp));
    transformationCodeFooter: |-
      return {
         value: result,
         timestamp: result_timestamp_optional
      };
    type: json
