  - id: 17
    name: Insert Machine
    propertyLinks: []
    transformationCodeBody: >-
      const SIK = msg.payload[16]


      let result = SIK;


      return {
          value: {
              'Serial': '${Machine Name}',
              'Name': '${Machine Name}',
              'Protocol': 'HEIDENHAIN',
              'Model': '${Machine Model}',
              'Manufacturer': '${Machine Manufacturer}'
          }
      }
    type: json
