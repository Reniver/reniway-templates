  - id: 20
    name: Insert Observation
    propertyLinks: []
    transformationCodeHeader: |-
      const SIK = msg.payload[16]
      const State = msg.payload[18]
      const Execution_Mode = msg.payload[19]

      const SIK_timestamp = new Date(msg.timestamps[16]);
      const State_timestamp = new Date(msg.timestamps[18]);
      const Execution_Mode_timestamp = new Date(msg.timestamps[19]);
    transformationCodeBody: |-
      let mode = 'Other';
      switch (Execution_Mode) {
          case 'DNC_EXEC_MANUAL': 
              mode = "Manual";
              break;
          case 'DNC_EXEC_MDI':
              mode = "MDI";
              break;
          case 'DNC_EXEC_RPF':
              mode = "RFP";
              break;
          case 'DNC_EXEC_SINGLESTEP':
              mode = "SingleStep";
              break;
          case 'DNC_EXEC_AUTOMATIC':
              mode = "Automatic";
              break;
          case 'DNC_EXEC_OTHER':
          case 'DNC_EXEC_SIMULO_TURBO_DEPRECATED':
              mode = "Other";
              break;
          case 'DNC_EXEC_HANDWHEEL':
              mode = "Handwheel";
      }

      let mstate = "NotConnected";
      switch (State) {
          case 'DNC_EVT_STATE_HOST_NOT_AVAILABLE':
              mstate = "NotConnected";
              break;
          case 'DNC_EVT_STATE_HOST_AVAILABLE':
          case 'DNC_EVT_STATE_WAIT_PERMISSION':
          case 'DNC_EVT_STATE_DNC_AVAILABLE':
              mstate = "Connected";
              break;
          case 'DNC_EVT_STATE_MACHINE_BOOTED':
              mstate = "Booted";
              break;
          case 'DNC_EVT_STATE_MACHINE_INITIALIZING':
              state = "Initializing";
              break;
          case 'DNC_EVT_STATE_MACHINE_AVAILABLE':
              mstate = "Available";
              break;
          case 'DNC_EVT_STATE_MACHINE_SHUTTING_DOWN':
              mstate = "ShuttingDown";
              break;
          case 'DNC_EVT_STATE_DNC_STOPPED':
          case 'DNC_EVT_STATE_HOST_STOPPED':
          case 'DNC_EVT_STATE_CONNECTION_LOST':
          case 'DNC_EVT_STATE_PERMISSION_DENIED':
          case 'DNC_EVT_STATE_NOT_INITIALIZED':
              mstate = 'NotConnected';
      }
      let result = {
          'Serial': '${Machine Name}',
          'Mode': mode,
          'State': mstate
      };

      let result_timestamp_optional = new Date(Math.max(SIK_timestamp, State_timestamp, Execution_Mode_timestamp));
    transformationCodeFooter: |-
      return {
         value: result,
         timestamp: result_timestamp_optional
      };
    type: json
    kind: Transformation
    order: 15
