remove: false
labels:
  - Machine Name : "Enter a unique name for your machine"
  - Machine Url : "Enter the Machine URL (ip/hostname)"
  - Database Name : "Enter the database name"
  - Database User : "Enter the database username"
  - Database Password : "Enter the database password"
connectors:
- id: 7
  name: TimescaleDB - ${Machine Name}
  properties:
  - id: 94
    name: ${Machine Name} - program data log
    propertyLinks: []
    retain: false
    queryString: INSERT INTO program_data_log VALUES (@Serial, NOW(), @ProgramName, @ProgramState::program_state, @CycleTime);
    parameters: '{"Serial":"Text","ProgramName":"Text","ProgramState":"Text","CycleTime":"Integer"}'
    direction: Output
    type: json
    order: 10
    isSystemProperty: false
    isPermanent: false
  - id: 99
    name: ${Machine Name} - override log
    propertyLinks:
    - id: 8
      targetBridgePropertyId: 99
      sourceDataMapperPropertyId: 71
    retain: false
    queryString: INSERT INTO override_log VALUES (@Serial, NOW(), @Feed, @Speed, @Rapid);
    parameters: '{"Serial":"Text","Feed":"Integer","Speed":"Integer","Rapid":"Integer"}'
    direction: Output
    type: json
    order: 9
    isSystemProperty: false
    isPermanent: false
  - id: 100
    name: ${Machine Name} - observation log
    propertyLinks:
    - id: 9
      targetBridgePropertyId: 100
      sourceDataMapperPropertyId: 67
    retain: false
    queryString: INSERT INTO observation_log VALUES (@Serial, NOW(), @Mode::machine_mode, @State::machine_state);
    parameters: '{"Serial":"Text","Mode":"Text","State":"Text"}'
    direction: Output
    type: json
    order: 11
    isSystemProperty: false
    isPermanent: false
  - id: 104
    name: ${Machine Name} - machine info
    propertyLinks:
    - id: 10
      targetBridgePropertyId: 104
      sourceDataMapperPropertyId: 68
    retain: false
    queryString: INSERT INTO machines VALUES (@Serial, @Name, @Protocol, @Model, @Manufacturer)
    parameters: '{"Serial":"Text","Name":"Text","Protocol":"Text","Model":"Text","Manufacturer":"Text"}'
    direction: Output
    type: json
    order: 12
    isSystemProperty: false
    isPermanent: false
  settings:
  - key: databaseType
    value: PostgreSQL
    description: ''
    settingType: Select
    optionsSerialized: '["PostgreSQL","MySQL","MSSQL"]'
    options:
    - PostgreSQL
    - MySQL
    - MSSQL
    activator: ''
    activationValue: ''
    readonly: false
  - key: encrypt
    value: true
    description: ''
    settingType: Bool
    optionsSerialized: '[]'
    options: []
    activator: databaseType
    activationValue: MSSQL
    readonly: false
  - key: trustServerCertificate
    value: false
    description: ''
    settingType: Bool
    optionsSerialized: '[]'
    options: []
    activator: encrypt
    activationValue: true
    readonly: false
  - key: hostNameInCertificate
    value: ''
    description: ''
    settingType: String
    optionsSerialized: '[]'
    options: []
    activator: trustServerCertificate
    activationValue: false
    readonly: false
  - key: host
    value: timescaledb
    description: ''
    settingType: String
    optionsSerialized: '[]'
    options: []
    activator: ''
    activationValue: ''
    readonly: false
  - key: port
    value: 5432
    description: ''
    settingType: Int
    optionsSerialized: '[]'
    options: []
    activator: ''
    activationValue: ''
    readonly: false
  - key: user
    value: ${Database User}
    description: ''
    settingType: String
    optionsSerialized: '[]'
    options: []
    activator: ''
    activationValue: ''
    readonly: false
  - key: password
    value: ${Database Password}
    description: ''
    settingType: Password
    optionsSerialized: '[]'
    options: []
    activator: ''
    activationValue: ''
    readonly: false
  - key: database
    value: ${Database Name}
    description: ''
    settingType: String
    optionsSerialized: '[]'
    options: []
    activator: ''
    activationValue: ''
    readonly: false
  - key: commandTimeout
    value: 10
    description: Time to wait (in seconds) before canceling a command. Set to 0 to disable.
    settingType: Int
    optionsSerialized: '[]'
    options: []
    activator: ''
    activationValue: ''
    readonly: false
  - key: extra
    value: ''
    description: ''
    settingType: String
    optionsSerialized: '[]'
    options: []
    activator: ''
    activationValue: ''
    readonly: false
  startup: false
  type: SQL
  connectorCategoryType: Enterprise
