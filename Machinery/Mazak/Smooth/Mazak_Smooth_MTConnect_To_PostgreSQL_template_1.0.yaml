      targetDataMapperPropertyId: 55
      sourceBridgePropertyId: 88
    type: string
    order: 11
  - id: 57
    name: Status
    propertyLinks:
    - id: 108
      targetDataMapperPropertyId: 57
      sourceBridgePropertyId: 7
    type: string
    order: 12
  - id: 63
    name: Program DataLog
    propertyLinks: []
    transformationCodeHeader: |-
      const program = msg.payload[38]
      const subprogram = msg.payload[39]
      const total_time = parseFloat(msg.payload[40])
      const cut_time = parseFloat(msg.payload[41])
      const execution = msg.payload[55]
      const Status = msg.payload[57]

      const program_timestamp = new Date(msg.timestamps[38]);
      const subprogram_timestamp = new Date(msg.timestamps[39]);
      const total_time_timestamp = new Date(msg.timestamps[40]);
      const cut_time_timestamp = new Date(msg.timestamps[41]);
      const execution_timestamp = new Date(msg.timestamps[55]);
      const Status_timestamp = new Date(msg.timestamps[57]);
    transformationCodeBody: |-
      let programState = execution;
      console.log(execution);
      console.log(Status);

      switch(programState) {
          case 'Finished':
          case 'FINISHED':
              programState = 'Finished';
              break;
          case 'Running':
          case 'RUNNING':
          case 'ACTIVE':
              programState = 'Running';
              break;
          case 'READY':
          case 'Idle':
          case 'IDLE':
              programState = 'Idle';
              break;
          case 'Stopped':
          case 'PROGRAM_STOPPED':
          case 'STOPPED':
              programState = 'Stopped';
              break;
          case 'Interrupted':
          case 'INTERRUPTED':
              programState = 'Interrupted';
              break;
          case 'Error':
          case 'ERROR':
              programState = 'Error';
              break;
      }
      let result = {
          Serial: '${Machine Name}',
          ProgramName: program + ' / ' + subprogram,
          ProgramState: programState,
          CycleTime: cut_time
      };

      let result_timestamp_optional = new Date(Math.max(program_timestamp, subprogram_timestamp, total_time_timestamp, cut_time_timestamp, execution_timestamp, Status_timestamp));
    transformationCodeFooter: |-
      return {
         value: result,
         timestamp: result_timestamp_optional
      };
    type: json
    kind: Transformation
    order: 14
