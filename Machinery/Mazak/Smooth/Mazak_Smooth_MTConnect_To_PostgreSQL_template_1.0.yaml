    - sourceDataMapperPropertyId: 38
      triggersTransformation: true
      isValueRequired: true
    - sourceDataMapperPropertyId: 39
      triggersTransformation: true
      isValueRequired: true
    - sourceDataMapperPropertyId: 40
      triggersTransformation: true
      isValueRequired: true
    - sourceDataMapperPropertyId: 41
