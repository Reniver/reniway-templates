  - id: 54
    name: Alarm Log
    propertyLinks: []
    transformationCodeBody: >
      const estop = msg.payload[45];

      const doorstate = msg.payload[53];


      // Define rules for generating alarms based on input

      const alarms = [];


      // Example rule: E-Stop triggered

      if (estop !== "ARMED") {
          alarms.push({
              Code: "E-STOP-001",
              Message: `Emergency Stop is in unsafe state: ${estop}`,
              Source: "System Monitor",
              Severity: 500,
              Time: new Date().toISOString()
          });
      }


      // Example rule: Door open or unlatched

      if (doorstate === "UNLATCHED") {
          alarms.push({
              Code: "DOOR-001",
              Message: "Machine door is unlatched",
              Source: "Safety Interlock",
              Severity: 300,
              Time: new Date().toISOString()
          });
      } else if (doorstate === "CLOSED") {
          alarms.push({
              Code: "DOOR-002",
              Message: "Machine door is closed",
              Source: "Safety Interlock",
              Severity: 100,
              Time: new Date().toISOString()
          });
      }


      // Final structure (matches your original format)

      return {
          value: {
              Serial: "${Machine Name}",
              Alarms: alarms
          }
      };
    type: json
    order: 17
  - id: 55
    name: execution
    propertyLinks:
    - id: 107
      targetDataMapperPropertyId: 55
      sourceBridgePropertyId: 88
    type: string
    order: 11
  - id: 57
    name: Status
    propertyLinks:
    - id: 108
      targetDataMapperPropertyId: 57
      sourceBridgePropertyId: 7
    type: string
    order: 12
  - id: 63
    name: Program DataLog
    propertyLinks: []
    transformationCodeBody: >-
      const program = msg.payload[38]

      const subprogram = msg.payload[39]

      const total_time = parseFloat(msg.payload[40])

      const cut_time = parseFloat(msg.payload[41])

      const execution = msg.payload[55]

      const Status = msg.payload[57]


      let programState = execution;

      console.log(execution);

      console.log(Status);


      switch(programState) {
          case 'Finished':
          case 'FINISHED':
              programState = 'Finished';
              break;
          case 'Running':
          case 'RUNNING':
          case 'ACTIVE':
              programState = 'Running';
              break;
          case 'READY':
          case 'Idle':
          case 'IDLE':
              programState = 'Idle';
              break;
          case 'Stopped':
          case 'PROGRAM_STOPPED':
          case 'STOPPED':
              programState = 'Stopped';
              break;
          case 'Interrupted':
          case 'INTERRUPTED':
              programState = 'Interrupted';
              break;
          case 'Error':
          case 'ERROR':
              programState = 'Error';
              break;
      }


      return {
          value: {
              Serial: '${Machine Name}',
              ProgramName: program + ' / ' + subprogram,
              ProgramState: programState,
              CycleTime: cut_time
          }
      };
    type: json
    order: 14
