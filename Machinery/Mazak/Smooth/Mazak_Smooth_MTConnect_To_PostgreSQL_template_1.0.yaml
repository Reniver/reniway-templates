  - id: 53
    name: doorstate
    propertyLinks:
    - id: 106
      targetDataMapperPropertyId: 53
      sourceBridgePropertyId: 8
    type: string
    order: 0
  - id: 54
    name: Alarm Log
    propertyLinks: []
    transformationCodeHeader: |-
      const estop = msg.payload[45];
      const doorstate = msg.payload[53];

      const estop_timestamp = new Date(msg.timestamps[45]);
      const doorstate_timestamp = new Date(msg.timestamps[53]);
    transformationCodeBody: |-
      // Define rules for generating alarms based on input
      const alarms = [];

      // Example rule: E-Stop triggered
      if (estop !== "ARMED") {
          alarms.push({
              Code: "E-STOP-001",
              Message: `Emergency Stop is in unsafe state: ${estop}`,
              Source: "System Monitor",
              Severity: 500,
              Time: new Date().toISOString()
          });
      }

      // Example rule: Door open or unlatched
      if (doorstate === "UNLATCHED") {
          alarms.push({
              Code: "DOOR-001",
              Message: "Machine door is unlatched",
              Source: "Safety Interlock",
              Severity: 300,
              Time: new Date().toISOString()
          });
      } else if (doorstate === "CLOSED") {
          alarms.push({
              Code: "DOOR-002",
              Message: "Machine door is closed",
              Source: "Safety Interlock",
              Severity: 100,
              Time: new Date().toISOString()
          });
      }

      // Final structure (matches your original format)
      let result = {
          Serial: "${Machine Name}",
          Alarms: alarms
      };

      let result_timestamp_optional = new Date(Math.max(estop_timestamp, doorstate_timestamp));
    transformationCodeFooter: |-
      return {
         value: result,
         timestamp: result_timestamp_optional
      };
    type: json
    kind: Transformation
    order: 17
    transformations:
    - sourceDataMapperPropertyId: 45
      triggersTransformation: true
      isValueRequired: true
    - sourceDataMapperPropertyId: 53
      triggersTransformation: true
      isValueRequired: true
    mergeInputs: []
    includeTriggerTimestamp: false
    triggerTimestampPropertyName: TriggerTime
  - id: 55
    name: execution
