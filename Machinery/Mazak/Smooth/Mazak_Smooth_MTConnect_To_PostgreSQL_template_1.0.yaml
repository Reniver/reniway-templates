  - id: 48
    name: Observation Log
    propertyLinks: []
    transformationCodeBody: >-
      const mode = msg.payload[46]

      const avail = msg.payload[47]


      let new_mode = 'Other';

      switch (mode) {
          case 'MANUAL':
              new_mode = "Manual";
              break;
          case 'AUTOMATIC':
              new_mode = "Automatic";
              break;
          case 'Other':
              new_mode = "Other";
      }


      let new_state = "NotConnected";

      switch (avail) {
          case 'NOT_AVAILABLE':
              new_state = "NotConnected";
              break;
          case 'AVAILABLE':
              new_state = "Available";
              break;
          case 'STOPPED':
          case 'CONNECTION_LOST':
          case 'PERMISSION_DENIED':
          case 'NOT_INITIALIZED':
              new_state = 'NotConnected';
      }


      return {
          value: {
              'Serial': '${Machine Name}',
              'Mode': new_mode,
              'State': new_state
          }
      }
    type: json
