    - id: 100
      targetDataMapperPropertyId: 45
      sourceBridgePropertyId: 80
    type: string
    order: 6
  - id: 46
    name: mode
    propertyLinks:
    - id: 101
      targetDataMapperPropertyId: 46
      sourceBridgePropertyId: 82
    type: string
    order: 7
  - id: 47
    name: avail
    propertyLinks:
    - id: 102
      targetDataMapperPropertyId: 47
      sourceBridgePropertyId: 9
    type: string
    order: 1
  - id: 48
    name: Observation Log
    propertyLinks: []
    transformationCodeHeader: |-
      const mode = msg.payload[46]
      const avail = msg.payload[47]

      const mode_timestamp = new Date(msg.timestamps[46]);
      const avail_timestamp = new Date(msg.timestamps[47]);
    transformationCodeBody: |-
      let new_mode = 'Other';
      switch (mode) {
          case 'MANUAL':
              new_mode = "Manual";
              break;
          case 'AUTOMATIC':
              new_mode = "Automatic";
              break;
          case 'Other':
              new_mode = "Other";
      }

      let new_state = "NotConnected";
      switch (avail) {
          case 'NOT_AVAILABLE':
              new_state = "NotConnected";
              break;
          case 'AVAILABLE':
              new_state = "Available";
              break;
          case 'STOPPED':
          case 'CONNECTION_LOST':
          case 'PERMISSION_DENIED':
          case 'NOT_INITIALIZED':
              new_state = 'NotConnected';
      }
      let result = {
          'Serial': '${Machine Name}',
          'Mode': new_mode,
          'State': new_state
      };

      let result_timestamp_optional = new Date(Math.max(mode_timestamp, avail_timestamp));
    transformationCodeFooter: |-
      return {
         value: result,
         timestamp: result_timestamp_optional
      };
    type: json
    kind: Transformation
    order: 15
